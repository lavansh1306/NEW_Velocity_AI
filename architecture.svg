  <text x="700" y="768" text-anchor="middle" class="text-title">Frontend Application Layer (React 18 + TypeScript + Vite)</text>
  
  <!-- Pages Row -->
  <rect x="80" y="785" width="200" height="70" class="component-box"/>
  <text x="180" y="803" text-anchor="middle" class="text-component">Pages/Routes</text>
  <text x="180" y="818" text-anchor="middle" class="text-tiny">Index | Demo | Projects</text>
  <text x="180" y="831" text-anchor="middle" class="text-tiny">Jira/Asana Dashboards</text>
  <text x="180" y="844" text-anchor="middle" class="text-tiny">ROI Calculator | Reports</text>
  
  <rect x="300" y="785" width="200" height="70" class="component-box"/>
  <text x="400" y="803" text-anchor="middle" class="text-component">Analytics Charts</text>
  <text x="400" y="818" text-anchor="middle" class="text-tiny">Chart.js | Recharts</text>
  <text x="400" y="831" text-anchor="middle" class="text-tiny">Gantt | Burndown | ROI</text>
  <text x="400" y="844" text-anchor="middle" class="text-tiny">Time Series | Metrics</text>
  
  <rect x="520" y="785" width="200" height="70" class="component-box"/>
  <text x="620" y="803" text-anchor="middle" class="text-component">UI Components</text>
  <text x="620" y="818" text-anchor="middle" class="text-tiny">shadcn/ui (Radix UI)</text>
  <text x="620" y="831" text-anchor="middle" class="text-tiny">Tailwind CSS</text>
  <text x="620" y="844" text-anchor="middle" class="text-tiny">Lucide Icons</text>
  
  <rect x="740" y="785" width="200" height="70" class="component-box"/>
  <text x="840" y="803" text-anchor="middle" class="text-component">State Management</text>
  <text x="840" y="818" text-anchor="middle" class="text-tiny">TanStack Query</text>
  <text x="840" y="831" text-anchor="middle" class="text-tiny">React Context API</text>
  <text x="840" y="844" text-anchor="middle" class="text-tiny">Toast Notifications</text>
  
  <rect x="960" y="785" width="180" height="70" class="component-box"/>
  <text x="1050" y="803" text-anchor="middle" class="text-component">Forms</text>
  <text x="1050" y="818" text-anchor="middle" class="text-tiny">React Hook Form</text>
  <text x="1050" y="831" text-anchor="middle" class="text-tiny">Zod Validation</text>
  <text x="1050" y="844" text-anchor="middle" class="text-tiny">Input Components</text>
  
  <rect x="1160" y="785" width="160" height="70" class="component-box"/>
  <text x="1240" y="803" text-anchor="middle" class="text-component">Routing</text>
  <text x="1240" y="818" text-anchor="middle" class="text-tiny">React Router v6</text>
  <text x="1240" y="831" text-anchor="middle" class="text-tiny">SPA Navigation</text>
  <text x="1240" y="844" text-anchor="middle" class="text-tiny">Dynamic Routes</text>
  
  <!-- ==================== DATA FLOW ARROWS ==================== -->
  <!-- External to API -->
  <path d="M 190 205 L 190 230 L 370 230 L 370 295" class="data-flow"/>
  <path d="M 430 205 L 430 230 L 370 230" class="data-flow"/>
  <path d="M 670 205 L 670 230 L 370 230" class="data-flow"/>
  <path d="M 910 205 L 910 230 L 370 230" class="data-flow"/>
  <path d="M 1180 205 L 1180 230 L 1150 230 L 1150 295" class="data-flow"/>
  
  <!-- API to Processing -->
  <path d="M 370 375 L 370 400 L 270 400 L 270 465" class="arrow"/>
  <path d="M 820 375 L 820 400 L 620 400 L 620 465" class="arrow"/>
  <path d="M 1150 375 L 1150 400 L 620 400" class="arrow"/>
  
  <!-- Processing to Intelligence -->
  <path d="M 270 545 L 270 565 L 220 565 L 220 635" class="arrow"/>
  <path d="M 620 545 L 620 565 L 520 565 L 520 635" class="arrow"/>
  <path d="M 830 545 L 830 560 L 830 635" class="arrow"/>
  
  <!-- Intelligence to Frontend -->
  <path d="M 220 695 L 220 720 L 180 720 L 180 785" class="arrow"/>
  <path d="M 520 695 L 520 720 L 400 720 L 400 785" class="arrow"/>
  <path d="M 830 695 L 830 720 L 620 720 L 620 785" class="arrow"/>
  <path d="M 1160 695 L 1160 720 L 840 720 L 840 785" class="arrow"/>
  
  <!-- Legend -->
  <rect x="1200" y="240" width="180" height="140" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" rx="8"/>
  <text x="1290" y="265" text-anchor="middle" style="font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1e293b;">Legend</text>
  
  <line x1="1220" y1="280" x2="1260" y2="280" class="arrow"/>
  <text x="1270" y="285" style="font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #475569;">Process Flow</text>
  
  <line x1="1220" y1="300" x2="1260" y2="300" class="data-flow"/>
  <text x="1270" y="305" style="font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #475569;">Data Flow</text>
  
  <rect x="1220" y="315" width="40" height="20" class="layer-box"/>
  <text x="1270" y="330" style="font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #475569;">Layer</text>
  
  <rect x="1220" y="342" width="40" height="18" class="component-box"/>
  <text x="1270" y="355" style="font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #475569;">Component</text>
  
  <rect x="1220" y="367" width="40" height="18" class="integration-box"/>
  <text x="1270" y="380" style="font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #475569;">Integration</text>
  
  <!-- Footer -->
  <rect x="0" y="870" width="1400" height="30" fill="#f1f5f9"/>
  <text x="700" y="890" text-anchor="middle" style="font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #475569; font-weight: 600;">
    Tech Stack: React 18 • TypeScript • Vite • Express • Node.js • Tailwind CSS • shadcn/ui • Chart.js • Recharts • TanStack Query
  </text>
</svg>
