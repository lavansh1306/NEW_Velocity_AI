  <text x="220" y="655" text-anchor="middle" class="text-component">Metrics Engine</text>
  <text x="220" y="670" text-anchor="middle" class="text-small">lib/metrics.ts</text>
  <text x="220" y="685" text-anchor="middle" class="text-tiny">Automation Coverage | Hours Saved | Cost Analysis</text>
  
  <rect x="380" y="635" width="280" height="60" class="component-box"/>
  <text x="520" y="655" text-anchor="middle" class="text-component">ROI Attribution</text>
  <text x="520" y="670" text-anchor="middle" class="text-small">Cost Savings Calculation</text>
  <text x="520" y="685" text-anchor="middle" class="text-tiny">Impact Analysis | Causal Attribution</text>
  
  <rect x="680" y="635" width="300" height="60" class="component-box"/>
  <text x="830" y="655" text-anchor="middle" class="text-component">Redeployment Engine</text>
  <text x="830" y="670" text-anchor="middle" class="text-small">Capacity Forecasting</text>
  <text x="830" y="685" text-anchor="middle" class="text-tiny">Team Allocation | Skill Graph Mapping</text>
  
  <rect x="1000" y="635" width="320" height="60" class="component-box"/>
  <text x="1160" y="655" text-anchor="middle" class="text-component">API Client</text>
  <text x="1160" y="670" text-anchor="middle" class="text-small">lib/api.ts | TanStack Query</text>
  <text x="1160" y="685" text-anchor="middle" class="text-tiny">React Query Hooks | Data Fetching</text>
  
  <!-- ==================== LAYER 5: FRONTEND / UI ==================== -->
