<svg width="1400" height="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .layer-box { fill: #3b82f6; stroke: #2563eb; stroke-width: 3; rx: 12; }
      .component-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .integration-box { fill: #f0f9ff; stroke: #0ea5e9; stroke-width: 2; rx: 6; }
      .text-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #ffffff; }
      .text-subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #ffffff; }
      .text-component { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #1e293b; font-weight: 600; }
      .text-small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #475569; }
      .text-tiny { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; fill: #64748b; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .data-flow { stroke: #10b981; stroke-width: 2.5; stroke-dasharray: 6,4; fill: none; marker-end: url(#arrowhead-green); }
      .highlight-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #0ea5e9; font-weight: 600; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#64748b" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10b981" />
    </marker>
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title Banner -->
  <rect x="0" y="0" width="1400" height="60" fill="url(#headerGradient)"/>
  <text x="700" y="35" text-anchor="middle" style="font-family: 'Segoe UI', Arial, sans-serif; font-size: 28px; font-weight: bold; fill: #ffffff;">
    Velocity AI - Workforce Intelligence Platform Architecture
  </text>
  
  <!-- ==================== LAYER 1: EXTERNAL INTEGRATIONS ==================== -->
  <rect x="50" y="80" width="1300" height="140" class="layer-box"/>
  <text x="700" y="108" text-anchor="middle" class="text-title">External Data Sources & Integrations</text>
  
  <!-- Integrations Row -->
  <rect x="80" y="120" width="220" height="85" class="integration-box"/>
  <text x="190" y="140" text-anchor="middle" class="text-component">Project Management</text>
  <text x="190" y="160" text-anchor="middle" class="text-small">• Jira (OAuth + REST API)</text>
  <text x="190" y="175" text-anchor="middle" class="text-small">• Asana (Token Auth)</text>
  <text x="190" y="190" text-anchor="middle" class="text-small">Issues, Sprints, Timelines</text>
  
  <rect x="320" y="120" width="220" height="85" class="integration-box"/>
  <text x="430" y="140" text-anchor="middle" class="text-component">CRM & Sales</text>
  <text x="430" y="160" text-anchor="middle" class="text-small">• HubSpot API</text>
  <text x="430" y="175" text-anchor="middle" class="text-small">Deals, Contacts, Campaigns</text>
  <text x="430" y="190" text-anchor="middle" class="text-small">Tickets, Analytics</text>
  
  <rect x="560" y="120" width="220" height="85" class="integration-box"/>
  <text x="670" y="140" text-anchor="middle" class="text-component">Microsoft 365</text>
  <text x="670" y="160" text-anchor="middle" class="text-small">• Graph API</text>
  <text x="670" y="175" text-anchor="middle" class="text-small">Meetings, Emails, Calendar</text>
  <text x="670" y="190" text-anchor="middle" class="text-small">Teams, OneDrive</text>
  
  <rect x="800" y="120" width="220" height="85" class="integration-box"/>
  <text x="910" y="140" text-anchor="middle" class="text-component">Automation Platform</text>
  <text x="910" y="160" text-anchor="middle" class="text-small">• Zapier API</text>
  <text x="910" y="175" text-anchor="middle" class="text-small">Workflow Runs</text>
  <text x="910" y="190" text-anchor="middle" class="text-small">Automation Metrics</text>
  
  <rect x="1040" y="120" width="280" height="85" class="integration-box"/>
  <text x="1180" y="140" text-anchor="middle" class="text-component">CSV Data Sources</text>
  <text x="1180" y="160" text-anchor="middle" class="text-small">• Local Demo Data (public/data/)</text>
  <text x="1180" y="175" text-anchor="middle" class="text-small">• Projects & Events CSVs</text>
  <text x="1180" y="190" text-anchor="middle" class="text-small">• Analytics Data Files</text>
  
  <!-- ==================== LAYER 2: INGESTION & API ==================== -->
  <rect x="50" y="250" width="1300" height="140" class="layer-box"/>
  <text x="700" y="278" text-anchor="middle" class="text-title">Data Ingestion & API Layer</text>
  
  <rect x="80" y="295" width="580" height="80" class="component-box"/>
  <text x="370" y="315" text-anchor="middle" class="text-component">Express API Server (Node.js + TypeScript)</text>
  <text x="370" y="335" text-anchor="middle" class="text-small">Port 4000 | CORS Enabled | REST Endpoints</text>
  <text x="370" y="350" text-anchor="middle" class="text-tiny">GET /api/issues | /api/projects | /api/asana/issues</text>
  <text x="370" y="365" text-anchor="middle" class="text-tiny">HubSpot Routes | Microsoft365 Routes | Health Check</text>
  
  <rect x="680" y="295" width="280" height="80" class="component-box"/>
  <text x="820" y="315" text-anchor="middle" class="text-component">Authentication Layer</text>
  <text x="820" y="335" text-anchor="middle" class="text-small">OAuth 2.0 Flow</text>
  <text x="820" y="350" text-anchor="middle" class="text-small">API Token Management</text>
  <text x="820" y="365" text-anchor="middle" class="text-small">Session Handling</text>
  
  <rect x="980" y="295" width="340" height="80" class="component-box"/>
  <text x="1150" y="315" text-anchor="middle" class="text-component">CSV Data Loader</text>
  <text x="1150" y="335" text-anchor="middle" class="text-small">csvLoader.ts | csv-parse Library</text>
  <text x="1150" y="350" text-anchor="middle" class="text-small">Load from public/data/*.csv</text>
  <text x="1150" y="365" text-anchor="middle" class="text-small">Parse & Transform to JSON</text>
  
  <!-- ==================== LAYER 3: PROCESSING & NORMALIZATION ==================== -->
  <rect x="50" y="420" width="1300" height="140" class="layer-box"/>
  <text x="700" y="448" text-anchor="middle" class="text-title">Data Processing & Normalization Layer</text>
  
  <rect x="80" y="465" width="380" height="80" class="component-box"/>
  <text x="270" y="485" text-anchor="middle" class="text-component">Data Normalization Engine</text>
  <text x="270" y="505" text-anchor="middle" class="text-small">lib/normalizers/: jira.ts | asana.ts | hubspot.ts</text>
  <text x="270" y="520" text-anchor="middle" class="text-small">microsoft365.ts | zapier.ts</text>
  <text x="270" y="535" text-anchor="middle" class="text-tiny">Transform to Canonical Event Model</text>
  
  <rect x="480" y="465" width="280" height="80" class="component-box"/>
  <text x="620" y="485" text-anchor="middle" class="text-component">Data Service</text>
  <text x="620" y="505" text-anchor="middle" class="text-small">lib/dataService.ts</text>
  <text x="620" y="520" text-anchor="middle" class="text-small">Data Fetching & Caching</text>
  <text x="620" y="535" text-anchor="middle" class="text-small">Aggregation & Filtering</text>
  
  <rect x="780" y="465" width="260" height="80" class="component-box"/>
  <text x="910" y="485" text-anchor="middle" class="text-component">Storage Layer</text>
  <text x="910" y="505" text-anchor="middle" class="text-small">lib/storage.ts</text>
  <text x="910" y="520" text-anchor="middle" class="text-small">Local Storage</text>
  <text x="910" y="535" text-anchor="middle" class="text-small">State Persistence</text>
  
  <rect x="1060" y="465" width="260" height="80" class="component-box"/>
  <text x="1190" y="485" text-anchor="middle" class="text-component">Type System</text>
  <text x="1190" y="505" text-anchor="middle" class="text-small">lib/types.ts</text>
  <text x="1190" y="520" text-anchor="middle" class="text-small">TypeScript Interfaces</text>
  <text x="1190" y="535" text-anchor="middle" class="text-small">Event, Project, Metrics</text>
  
  <!-- ==================== LAYER 4: INTELLIGENCE & ANALYTICS ==================== -->
